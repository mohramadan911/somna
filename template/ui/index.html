<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somna</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E %3Crect rx='112' fill='#0E1630'/%3E %3Cg transform='translate(14 36)'%3E%3Cpath d='M112.0 170.0 L148.9 170.0 L148.9 240.4 L185.7 240.4 L185.7 284.4 L222.6 284.4 L222.6 346.0 L259.4 346.0 L259.4 214.0 L296.3 214.0 L296.3 284.4 L333.1 284.4 L333.1 170.0 L370.0 170.0' fill='none' stroke='#F2C94C' stroke-width='16' stroke-linejoin='round' stroke-linecap='round'/%3E %3Ccircle cx='392.0' cy='112.0' r='24' fill='#E8E2C9'/%3E%3C/g%3E %3C/svg%3E">
<style>
:root{
  --bg:#F4F2EA; --blob1:rgba(242,201,76,.22); --blob2:rgba(124,140,245,.16); --blob3:rgba(59,75,200,.20);
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.78); --glass-line:rgba(14,22,48,.10); --glass-hi:rgba(255,255,255,.7);
  --shadow:0 10px 30px rgba(14,22,48,.10); --text:#0E1630; --muted:#474F6E; --dim:#666E8C; --line-2:rgba(14,22,48,.06);
  --indigo:#3B4BC8; --gold:#F2C94C; --gold-ink:#6B5310; --sky:#4F5FD6;
  --add-bg:rgba(46,160,90,.14); --add-fg:#1E5A31; --del-bg:rgba(220,60,60,.13); --del-fg:#8F2323; --warn-bg:rgba(242,201,76,.16);
  --chip:rgba(255,255,255,.55); --ink:#0E1630;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0A1024; --blob1:rgba(242,201,76,.20); --blob2:rgba(124,140,245,.18); --blob3:rgba(59,75,200,.30);
    --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.10); --glass-line:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.10);
    --shadow:0 12px 34px rgba(0,0,0,.35); --text:#EEF0F8; --muted:#BFC6E0; --dim:#949DBE; --line-2:rgba(255,255,255,.07);
    --indigo:#9FAAF5; --gold-ink:#F6D77A; --sky:#A9B4FA;
    --add-bg:rgba(80,200,120,.16); --add-fg:#A6EBBD; --del-bg:rgba(255,90,90,.16); --del-fg:#FFB4B4; --warn-bg:rgba(242,201,76,.18);
    --chip:rgba(255,255,255,.08)}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.5 var(--sans);background:transparent}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(40vmax 34vmax at 85% 8%,var(--blob1),transparent 70%),
             radial-gradient(38vmax 32vmax at 8% 40%,var(--blob2),transparent 70%),
             radial-gradient(46vmax 40vmax at 60% 100%,var(--blob3),transparent 70%),var(--bg)}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 26px;color:#fff;background:linear-gradient(110deg,rgba(14,22,48,.86),rgba(27,37,80,.78));border-bottom:1px solid rgba(242,201,76,.55);
  -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand b{font-size:22px;letter-spacing:-.02em;color:#E8E2C9}
.brand .mark{flex:none;align-self:center}
.brand span{color:#E8E2C9}
.brand small{color:#B3BAD6;font-size:12px}
.hdr-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:13px;color:#fff;font-family:inherit;cursor:pointer;transition:background-color .18s,transform .14s}
button.pill:hover{background:rgba(255,255,255,.22)} button.pill:active{transform:scale(.97)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,201,76,.55)}70%{box-shadow:0 0 0 9px rgba(242,201,76,0)}100%{box-shadow:0 0 0 0 rgba(242,201,76,0)}}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:12px;
  border:1px solid var(--glass-line);background:var(--glass-2);color:var(--text);font-weight:550;letter-spacing:.005em;
  box-shadow:0 1px 0 var(--glass-hi) inset,0 2px 8px rgba(14,22,48,.06);
  transition:transform .14s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:rgba(59,75,200,.35);box-shadow:0 1px 0 var(--glass-hi) inset,0 8px 20px rgba(14,22,48,.14)}
.btn:active:not(:disabled){transform:translateY(0) scale(.97);box-shadow:0 1px 0 var(--glass-hi) inset,0 2px 6px rgba(14,22,48,.12)}
.btn:disabled{opacity:.55}
.btn.primary{border:none;color:#0E1630;background:linear-gradient(135deg,#F8E08E 0%,#F2C94C 55%,#E0B23A 100%);font-weight:650;
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 6px 18px rgba(242,201,76,.35)}
.btn.primary:hover:not(:disabled){box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 26px rgba(242,201,76,.5);border:none}
.btn.ghost{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.30);color:#fff;box-shadow:none}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);box-shadow:0 8px 22px rgba(0,0,0,.25)}
.btn.link{border:none;background:transparent;box-shadow:none;color:var(--indigo);padding:0 8px;min-height:36px}
.btn.link:hover:not(:disabled){box-shadow:none;text-decoration:underline}
.btn.is-busy{color:transparent!important;pointer-events:none}
.btn.is-busy::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid;border-color:rgba(14,22,48,.25) rgba(14,22,48,.25) rgba(14,22,48,.85) rgba(14,22,48,.85);animation:spin .8s linear infinite}
.btn.ghost.is-busy::after{border-color:rgba(255,255,255,.3) rgba(255,255,255,.3) #fff #fff}
@media (prefers-color-scheme: dark){.btn.is-busy:not(.primary)::after{border-color:rgba(255,255,255,.25) rgba(255,255,255,.25) #fff #fff}}
@keyframes spin{to{transform:rotate(360deg)}}

nav{position:sticky;top:64px;z-index:4;display:flex;flex-wrap:wrap;gap:6px;margin:16px auto 0;max-width:1200px;padding:6px;width:calc(100% - 40px)}
nav button{min-height:40px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);font-weight:550;transition:background-color .18s,transform .14s}
nav button:hover{background:var(--line-2)}
nav button:active{transform:scale(.97)}
nav button[aria-current="page"]{background:linear-gradient(135deg,#0E1630,#26337A);color:#fff;box-shadow:0 6px 16px rgba(14,22,48,.35)}
@media (prefers-color-scheme: dark){nav button[aria-current="page"]{background:linear-gradient(135deg,#EEF0F8,#D8DCF0);color:#0E1630;box-shadow:0 6px 18px rgba(0,0,0,.3)}}
nav .count{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--gold);color:#0E1630;font-size:12px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:22px 20px 140px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:30px;letter-spacing:-.02em;line-height:1.15}
h2{margin:0;font-size:18px}
.sub{margin:0;color:var(--muted);font-size:14px}
.card{padding:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{padding:14px 16px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-size:23px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.tile .s{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px;align-items:start}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--glass-line);font-size:13px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;vertical-align:middle}
.b-review{background:var(--warn-bg);color:var(--gold-ink)}
.b-adopted{background:var(--add-bg);color:var(--add-fg)}
.b-failed{background:var(--del-bg);color:var(--del-fg)}
.b-muted{background:var(--line-2);color:var(--muted)}
.b-running{background:rgba(59,75,200,.15);color:var(--indigo)}
.b-canceled{background:var(--line-2);color:var(--muted);text-decoration:line-through}
.banner{padding:14px 16px;border-radius:14px;border:1px solid var(--glass-line)}
.banner.ok{background:var(--add-bg);color:var(--add-fg);border-color:transparent}
.banner.warn{background:var(--warn-bg);color:var(--gold-ink);border-color:transparent}
.banner.bad{background:var(--del-bg);color:var(--del-fg);border-color:transparent}
.banner.info{background:var(--glass)}
.md h3{margin:14px 0 6px;font-size:16px}
.md h3:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
code{font-family:var(--mono);font-size:13px;background:var(--line-2);padding:1px 5px;border-radius:6px}
.diff-file{border:1px solid var(--glass-line);border-radius:12px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.04)}
.diff-file:first-child{margin-top:0}
.diff-name{padding:7px 12px;background:var(--line-2);font:500 13px var(--mono)}
.diff-body{overflow-x:auto;font:13px/1.6 var(--mono)}
.dl{padding:0 12px;white-space:pre}
.dl.add{background:var(--add-bg);color:var(--add-fg)}
.dl.del{background:var(--del-bg);color:var(--del-fg)}
.dl.ctx{color:var(--dim)}
.dl.hunk{color:var(--indigo)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;bottom:14px;padding:14px 16px;z-index:3}
.actions .note{margin-left:auto;font-size:13px;color:var(--muted);max-width:400px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:10px 14px;border-bottom:1px solid var(--glass-line)}
td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr.click{cursor:pointer;transition:background-color .15s}
tr.click:hover td{background:var(--line-2)}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.files{flex:1 1 260px;max-width:340px;display:flex;flex-direction:column;gap:2px;padding:8px}
.files button,.repo-btn{transition:background-color .15s,transform .12s}
.files button{display:flex;justify-content:space-between;gap:8px;text-align:left;min-height:38px;padding:6px 10px;border:none;border-radius:10px;background:transparent;color:var(--text);font:13px var(--mono)}
.files button:hover{background:var(--line-2)}
.files button:active,.repo-btn:active{transform:scale(.98)}
.files button[aria-current="true"]{background:linear-gradient(135deg,#0E1630,#26337A);color:#fff}
@media (prefers-color-scheme: dark){.files button[aria-current="true"]{background:linear-gradient(135deg,#EEF0F8,#D8DCF0);color:#0E1630}}
.grp{font:600 12px var(--sans);color:var(--dim);padding:10px 10px 2px;text-transform:uppercase;letter-spacing:.05em}
.viewer{flex:999 1 460px;min-width:0}
pre.file{margin:0;padding:16px;border-radius:12px;background:var(--line-2);border:1px solid var(--glass-line);font:13px/1.7 var(--mono);white-space:pre-wrap;word-break:break-word}
textarea{width:100%;min-height:420px;padding:14px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass-2);color:var(--text);font:13px/1.7 var(--mono);resize:vertical}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.ico{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ico.ok{background:var(--add-bg);color:var(--add-fg)} .ico.warn{background:var(--warn-bg);color:var(--gold-ink)} .ico.fail{background:var(--del-bg);color:var(--del-fg)}
.check p{margin:0} .check .d{font-size:13px;color:var(--muted);word-break:break-word}
.bar{height:10px;border-radius:999px;background:var(--line-2);overflow:hidden;margin-top:8px}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,#3B4BC8,#7C8CF5,#F2C94C)}
.empty ol{padding-left:20px;margin:10px 0 0}
select,.filters input,.form-row input{min-height:40px;border-radius:11px;border:1px solid var(--glass-line);background:var(--glass-2);color:var(--text);padding:0 10px;font:14px var(--sans);max-width:100%}
select{font:13px var(--mono)}
.pick{max-width:100%;min-width:0;flex-wrap:nowrap}.pick select{min-width:0;width:100%;max-width:440px}
.lvl{display:inline-block;min-width:52px;text-align:center;padding:1px 8px;border-radius:999px;font:600 11.5px var(--sans);text-transform:uppercase}
.lvl.error{background:var(--del-bg);color:var(--del-fg)} .lvl.warn{background:var(--warn-bg);color:var(--gold-ink)}
.lvl.info{background:var(--line-2);color:var(--muted)} .lvl.debug{color:var(--dim)}
.logs td{font-size:13px} .logs td.t{white-space:nowrap;color:var(--muted);font:12px var(--mono)}
.logs details summary{cursor:pointer;color:var(--indigo);font-size:12px}
.logs pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font:12px var(--mono);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px}
.repo-layout{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.repo-list{flex:1 1 320px;max-width:440px;display:flex;flex-direction:column;gap:4px;padding:10px}
.repo-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:52px;padding:8px 10px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text);width:100%}
.repo-btn:hover{background:var(--line-2)}
.repo-btn[aria-current="true"]{border-color:rgba(59,75,200,.45);background:var(--line-2)}
.repo-btn .n{font-weight:650} .repo-btn .p{font:12px var(--mono);color:var(--muted);word-break:break-all}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.repo-detail{flex:999 1 460px;min-width:0;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px;margin:12px 0 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}
.q{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--gold-ink);font-size:14px}
.q.err{background:var(--del-bg);color:var(--del-fg)} .q.w{background:var(--line-2);color:var(--muted)}
.q .qb{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.q .qa{display:flex;flex-wrap:wrap;gap:8px}
.q .btn{min-height:36px;padding:0 14px;font-size:14px}
.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

#dock{position:fixed;right:20px;bottom:20px;z-index:8;width:min(440px,calc(100vw - 32px));padding:16px 18px;border-radius:20px;
  transform:translateY(16px);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;background:var(--glass-2)}
#dock.show{opacity:1;transform:none;pointer-events:auto}
#dock .top{display:flex;gap:12px;align-items:center}
#dock .t{font-weight:700;font-size:15px}
#dock .st{font-size:13px;color:var(--muted)}
#dock .meter{height:10px;border-radius:999px;background:var(--line-2);overflow:hidden;margin:12px 0 6px}
#dock .meter>div{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#3B4BC8,#7C8CF5,#F2C94C,#3B4BC8);background-size:300% 100%;
  transition:width .8s cubic-bezier(.2,.8,.2,1);animation:flow 3s linear infinite}
@keyframes flow{to{background-position:-300% 0}}
#dock .meta{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
#dock .steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#dock .stp{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--glass-line);color:var(--dim)}
#dock .stp.done{background:var(--add-bg);color:var(--add-fg);border-color:transparent}
#dock .stp.active{background:rgba(59,75,200,.16);color:var(--indigo);border-color:transparent}
#dock .feed{margin-top:10px;font:12px/1.5 var(--mono);color:var(--muted)}
#dock .feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#dock.done .meter>div{animation:none}
.orb{flex:none;width:44px;height:44px}
.orb .moon{fill:url(#mg)}
.orb .spark{fill:#F8E08E;transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.orb .s2{animation-delay:.5s} .orb .s3{animation-delay:1s}
.orb .pen{fill:none;stroke:#F2C94C;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:46;stroke-dashoffset:46;animation:write 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes write{0%{stroke-dashoffset:46;opacity:1}60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
#dock.done .spark,#dock.done .pen{animation:none} #dock.done .pen{stroke-dashoffset:0;opacity:1;stroke:#2EA05A}
#dock .feed .tg{display:inline-block;min-width:44px;margin-right:6px;padding:0 6px;border-radius:6px;font:600 10.5px var(--sans);text-transform:uppercase;text-align:center;background:var(--line-2);color:var(--muted)}
#dock .feed .tg.r{background:rgba(59,75,200,.14);color:var(--indigo)} #dock .feed .tg.w{background:var(--warn-bg);color:var(--gold-ink)}
#dock .feed .say{font-family:var(--sans);font-style:italic}
#dock .ops{font:12px var(--mono);color:var(--muted);margin-top:4px}
#sheetWrap{position:fixed;inset:0;z-index:10;background:rgba(10,16,36,.42);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 24px;overflow:auto;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#sheet{width:min(660px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--glass-2);animation:fade .2s ease}
#sheet fieldset{border:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px}
#sheet legend{font-weight:600;margin-bottom:6px;padding:0}
#sheet .opt{display:flex;gap:8px;align-items:center;min-height:36px;cursor:pointer}
.fl{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
textarea.small{min-height:96px}
.slist{max-height:min(340px,45vh);overflow:auto;display:flex;flex-direction:column;gap:2px;border:1px solid var(--glass-line);border-radius:12px;padding:6px;margin-top:8px}
.srow{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;cursor:pointer}
.srow:hover{background:var(--line-2)} .srow input{margin-top:4px;flex:none}
.srow .tl{word-break:break-word} .srow .m{font:12px var(--mono);color:var(--muted)}
.decs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.dec{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:baseline;padding:10px 12px;border-radius:12px;background:var(--line-2)}
.dec.held{background:var(--warn-bg)} .dec.bad{background:var(--del-bg)}
.dec .f{font:12.5px var(--mono);color:var(--muted);word-break:break-all}
.dec .sm{flex:1 1 100%;font-size:14px} .dec .ev{font:12px var(--mono);color:var(--dim)}

const TOKEN = "__CYCLE_TOKEN__";
const S = { tab: "review", data: null, sig: "", cycleId: null, detail: null, files: null, file: null, editing: false, autoPicked: false,
  repos: null, repoSel: null, showClientForm: false, logs: null, logF: { level: "info", event: "", q: "", cycle: "" }, logsAuto: true,

const $ = (s, r) => (r || document).querySelector(s);
const HELP = {
  run: ["Run cycle now", "Starts a cycle right away. You can add instructions for this run, pick a model and choose which sessions to read. It reads your Claude Code sessions, curates each client in its own copy of memory and proposes changes. Usually 2 to 6 minutes. Nothing changes until you adopt."],
  map: ["Map", "Reads this repo once with read-only tools (read, list, search) and writes its context file: what it does, how to navigate it, how it connects, current state, gotchas and open questions. Usually 1 to 3 minutes. The repo itself is never changed. The context becomes active when you adopt the proposal."],
  scan: ["Scan past sessions", "Reads your Claude Code session files from the last 30 days to find the git repos you worked in. It does not call Claude and costs nothing."],
  client: ["Clients", "A client groups its repos. Markers are words found in the client's folder names or git remotes, like acme or acme-corp. They drive suggestions and ownership checks. Each client's knowledge stays in its own folder."],
  assign: ["Which client", "Tells Somna which client this repo belongs to. Confirming creates the repo's inbox, and from then on its context is added to every Claude Code session and subagent in this folder."],
  context: ["Repo context", "One file per repo that every session in it starts with. Map writes the first version; nightly cycles keep it current from your sessions, the inbox and the git log."],
  inbox: ["Inbox", "Agents add one dated line here when they learn something lasting about the repo. The nightly cycle merges the lines into the context and clears them."],
  instructions: ["Instructions for agents", "Placed in front of the context when a session starts here. Tell agents how to use it, for example which folders to touch or what to ask before changing something."],
  questions: ["Checks and questions", "Things Somna could not decide on its own, like whether a repo really belongs to a client. Answer with the buttons; answers are remembered."],
  adopt: ["Adopt", "Merges the proposal into your memory after checking nobody changed memory since the run started, and records it in CHANGELOG.md. New sessions use it right away. Git keeps the old version."],
  discard: ["Discard", "Deletes the proposal. Your memory stays exactly as it was."],
  decisions: ["What changed", "Every change says in plain words what it does and why, where it goes, and the moments behind it: the day, the repo and what you asked. Sure: two sources or something you said. Fairly sure: one clear source. Not sure: held for you. In the full pipeline a change is only saved after its quotes and code were checked, a check tried to disprove it, and a fresh agent confirmed it. Details shows the ids."],
  trial: ["Try it before adopting", "Starts a Claude Code session in the repo that gets the proposed context instead of the current one. Use it to see if the proposal helps. Nothing is adopted."],
  activity: ["Memory it read and wrote", "Which memory files Claude opened and changed during the run, from its own event stream."],
  versions: ["Versions", "Every saved version of this file. If an old version held a secret or personal data, Redact removes its content from history. The record that the version existed stays."],
  edit: ["Editing memory", "Saving commits the file, so it can always be undone. Agents cannot edit memory files themselves; only you and the cycle can."],
  cancel: ["Cancel run", "Stops the run. Its partial output is deleted and memory stays as it was."],
  logs: ["Logs", "Every decision Somna makes, with who caused it: schedule, page, terminal or hook. Use the filters to follow one run."],
  nightly: ["Nightly cycle", "Runs on the days and at the time you pick and reads the sessions since the last cycle. If the Mac was asleep, it runs within 12 hours after it wakes."],
  weekly: ["Weekly cycle", "A deeper pass once a week over the last days of sessions, usually with a stronger model, to merge what nightly runs missed and tidy up. It covers that night too."],
  model: ["Model for cycles", "Used by nightly and manual cycles unless you pick another one in the run form. Check runs a one-line test through your Claude Code, which proves it works with your sign-in or provider."],
  weekly_model: ["Model for the weekly cycle", "Often a stronger model than the nightly one, since it runs once a week."],
  map_model: ["Model for Map", "Map reads a whole repo once. A capable model writes a better first context."],
  models_source: ["Where the list comes from", "With an API key, from the Claude API Models endpoint. On Amazon Bedrock, from your inference profiles (ARNs). With a Claude account sign-in there is no API to ask, so the list is a built-in list of current Claude models. Check confirms the one you pick."],
  max_budget_usd: ["Spend cap per run", "Claude Code stops a run once its estimated spend reaches this amount. Each client in a cycle is one run. Empty means no cap."],
  map_max_budget_usd: ["Spend cap per map", "The same cap for Map runs."],
  max_turns: ["Turn limit per run", "A turn is one round of Claude working (read a file, search, edit). The run stops with an error at this limit. Empty means no limit."],
  timeout_minutes: ["Time limit per run", "A run that takes longer is stopped and reported as a timeout."],
  max_sessions: ["Sessions per cycle", "At most this many sessions are read in one cycle, newest first. The limit is 100."],
  parallel_runs: ["Clients at the same time", "How many client runs go in parallel. Each works in its own copy of memory. 1 runs them one after another."],
  default_since_hours: ["First-run window", "When there is no earlier cycle, read sessions from this many hours back."],
  max_memory_kb: ["Memory size limit", "A cycle refuses to run when memory is bigger than this, so runs stay fast and cheap. Each file should also stay under 100 kB."],
  run_digest_budget_kb: ["Reading budget per client run", "How much session text Claude reads in one client run. Small sessions are read in full first, then the big ones share what is left. 400 KB is about 100k tokens."],
  session_max_kb: ["Most one session can take", "The most of the budget a single session may use, so one very long session cannot crowd out the rest. Above this it is shortened: tool calls and long output first, your words and Claude's answers last. The full text stays available to Claude."],
  stale_after_days: ["Clean up current state after", "The cycle removes \"Current state\" items whose as-of date is older than this, unless newer sessions or commits confirm them. Git keeps the history."],
  pipeline: ["How changes are checked", "Full: code first writes down what you did. Then separate searches look for stale facts, new facts, your corrections and tidying. Code checks every quote word for word against your sessions and every file, line and function against the repo. Another run tries to disprove each finding, and a fresh agent that never saw the reasoning confirms it. Only changes that pass all of that are saved; doubtful ones become questions. It costs several Claude runs per client instead of one. One pass: a single run per client edits memory directly, cheaper, and nothing checks it independently."],
  hunt_model: ["Model for finding changes", "Used by the searches that look for changes. Empty uses the cycle model."],
  check_model: ["Model for the checks", "Used by the disprove step and the fresh check. A cheaper model like Haiku or Sonnet keeps cost down; they only read and compare. Empty uses the cycle model."],
  did: ["What you did", "Built by Somna from your sessions and commits, before Claude is asked anything: when you worked, in which repo, what you asked first and which files changed. Below each client: the steps the cycle went through and what each one let through."],
  dropped: ["Checked and dropped", "Findings that did not survive: a quote that is not in your sessions, code that does not exist, text that already changed, a check that disproved it, a fresh agent that disagreed, or evidence older than what memory already says. Listed so you can see what was left out and why."],
  sessions_read: ["Sessions read", "Each session's size, and how much of it the cycle read. Shortened sessions kept your words and Claude's answers first; the full text was available to Claude."],
  context_max_chars: ["Repo context size", "Target size of each repo context. The hook adds at most about 9,500 characters at session start."],
  remap_after_commits: ["Re-map suggestion", "Suggest Re-map after this many commits in a repo since its last map."],
  review_mode: ["Review mode", "Adopt automatically when safe: the cycle saves its changes into memory by itself when nothing looks wrong (every change medium or high confidence, nothing written outside its folders, every change has a reason, no part failed, you did not edit memory meanwhile). Anything else waits for you. Ask me for everything: every cycle waits for your Adopt."],
  held_expiry_days: ["Questions expire after", "Questions you do not answer are dismissed after this many days, so the list does not grow forever."],
  summary: ["What happened while you were away", "Cycles saved automatically since you last clicked Got it, cycles waiting for you and the reason, and how many questions are open. Undo puts memory back as it was before an automatic save."],
  undo: ["Undo this adopt", "Puts memory back exactly as it was before this adopt, with a git revert. Git keeps every version. The next cycle reads those sessions again."],
  questions_tab: ["Questions", "Changes Claude was not sure about, from all cycles. They were never saved. Accept sends one to the place the button names and the next cycle applies it; Dismiss drops it. Unanswered questions expire after a few days (Settings)."],
  hold_low_confidence: ["Hold low-confidence changes", "When on, the cycle does not apply changes it is unsure about. They wait for your Accept or Dismiss."],
  auto_close_empty: ["Close empty cycles", "A cycle that changes nothing closes itself instead of waiting for review."],
  notify: ["Notifications", "A macOS notification when a cycle is ready or failed."],
  stream_events: ["Live events", "Shows what Claude does while a run works. Turn off only if your Claude Code is too old for stream-json."],
};
const DOCK_INFO = {
  cycle: "Reading your sessions and curating each client in its own copy of memory. Usually 2 to 6 minutes. You can close this page; nothing changes until you adopt.",
  map: "Reading the repo with read-only tools to write its context file. Usually 1 to 3 minutes. The repo is not changed.",
  scan: "Reading session files to find your repos. No Claude call, no cost.",
};
function hq(key) { return '<button class="hq" type="button" data-help="' + key + '" aria-label="Help: ' + esc((HELP[key] || [key])[0]) + '">?</button>'; }
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Somna-Token": TOKEN }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  let j = {};
  try { j = await r.json(); } catch (e) { j = { error: "bad response (" + r.status + ")" }; }
  if (!r.ok) { const err = new Error(j.error || ("HTTP " + r.status)); err.code = j.code; throw err; }
  return j;
}
let toastTimer;
function toast(msg, bad) {
  const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, bad ? 9000 : Math.max(4000, Math.min(12000, msg.length * 60)));
}
/* run an action with a busy button: the button shows a spinner, nothing else on the page moves */
async function busy(btn, fn) {
  if (btn) { btn.classList.add("is-busy"); btn.disabled = true; btn.setAttribute("aria-busy", "true"); }
  try { return await fn(); }
  finally { if (btn && document.body.contains(btn)) { btn.classList.remove("is-busy"); btn.disabled = false; btn.removeAttribute("aria-busy"); } }
}
function fmtTime(s) {
  if (!s) return "";

      (function (k) { return k < 10 ? k.toFixed(1) : Math.round(k); })(sl.reduce((a, x) => a + (x.size_kb || 0), 0)) + " KB</span></summary><div class=\"scroll\" style=\"margin-top:10px\"><table style=\"min-width:560px\"><thead><tr><th>Session</th><th>Repo</th><th>First activity</th><th>Last activity</th><th>Size</th><th>Read</th><th>Subagents</th></tr></thead><tbody>" +
      sl.slice().sort((a, b) => String(a.last_activity || "").localeCompare(String(b.last_activity || ""))).map((x) => '<tr><td class="mono">' + esc(x.id) + "</td><td>" + esc(x.repo) + "</td><td>" + esc(fmtTime(x.first_activity)) + "</td><td>" + esc(fmtTime(x.last_activity)) + "</td><td>" + esc(x.size_kb + " KB · ~" + fmtTok(x.est_tokens)) + "</td><td>" +
        (x.truncated ? '<span class="badge b-review">' + esc(x.read_pct + "%, shortened") + "</span>" : '<span class="badge b-adopted">all</span>') +
        (x.already_read_until ? ' <span class="badge b-muted">earlier part already read</span>' : "") + "</td><td>" + (x.subagents || 0) + "</td></tr>").join("") + "</tbody></table></div></details>";
  }
  const actv = r.activity || {};
  if (Object.keys(actv).length) {
    h += '<section class="glass card"><h2>What you did' + hq("did") + '</h2>' + Object.keys(actv).sort((a, b) => (a === "general") - (b === "general") || a.localeCompare(b)).map((g) => {
      const A = actv[g], run = (r.runs || []).find((x) => x.group === g) || {};
      const nm = g === "general" ? "Outside client repos" : String(A.title || g).replace(/^Client: /, "");
      const ss = (A.sessions || []).map((x) => '<div class="s"><b>' + esc(dayName(x.first)) + ", " + esc(String(x.first || "").slice(11, 16)) + "</b> · " + esc(x.repo || "") +
        (x.first_message ? " · <q>" + esc(x.first_message) + "</q>" : "") + (x.files_changed && x.files_changed.length ? " <small>· " + x.files_changed.length + " file" + (x.files_changed.length === 1 ? "" : "s") + " changed</small>" : "") + "</div>").join("");
      const cs = Object.keys(A.commits || {}).map((k) => '<div class="s"><small>' + esc(k) + ": " + A.commits[k].length + " commit" + (A.commits[k].length === 1 ? "" : "s") + " · latest <q>" + esc(A.commits[k][0].subject) + "</q></small></div>").join("");
      const st = {}; (run.stages || []).forEach((x) => st[x.stage] = x);
      const pipe = run.stages ? '<div class="pipe">' + [
        st.recon && "<span>Read your work</span>",
        st.hunt && "<span>Looked for " + (st.hunt.small_night ? "all kinds of change" : (st.hunt.classes || []).length + " kinds of change") + (st.hunt.findings != null ? ": " + st.hunt.findings + " found" : "") + "</span>",
        st.check && "<span>Checked quotes and code: " + st.check.passed + " passed" + (st.check.rejected ? ", " + st.check.rejected + " dropped" : "") + "</span>",
        st.validate && "<span>Tried to disprove: " + (st.validate.upheld || 0) + " held up" + (st.validate.refuted ? ", " + st.validate.refuted + " disproved" : "") + "</span>",
        st.verify && "<span>Fresh check: " + (st.verify.confirmed || 0) + " confirmed" + (st.verify.rejected ? ", " + st.verify.rejected + " rejected" : "") + "</span>",
        st.apply && "<span>Saved " + st.apply.saved + " · asked " + st.apply.questions + " · dropped " + st.apply.dropped + "</span>"].filter(Boolean).join("<i>→</i>") + "</div>" : "";
      return '<div class="did"><strong>' + esc(nm) + "</strong>" + ss + cs + pipe + "</div>";
    }).join("") + "</section>";
  }
  const allDecs = (r.decisions || []).map((d, i) => Object.assign({ i: i }, d));
  const decs = allDecs.filter((d) => !d.dropped), dropped = allDecs.filter((d) => d.dropped);
  if (decs.length) {
    const openQ = decs.filter((d) => !d.applied && !d.accepted_at && !d.dismissed_at);
    const rest = decs.filter((d) => openQ.indexOf(d) < 0).sort((a, b) => String(b.evidence_newest || "").localeCompare(String(a.evidence_newest || "")) || (a.synthetic ? -1 : 0));
    const acts = (d) => s.needs_review !== undefined ? '<button class="btn primary" type="button" data-dec="accept" data-i="' + d.i + '">Accept → ' + esc(d.accept_where || friendly(d.accept_to)) + "</button>" +
      '<button class="btn" type="button" data-dec="dismiss" data-i="' + d.i + '">Dismiss</button>' : "";

      openQ.map((d) => decCard(d, { actions: acts(d) })).join("") + "</div></section>";
    if (rest.length) h += '<section class="glass card"><div class="row between"><h2>What changed' + hq("decisions") + '</h2><span class="sub">newest first, by the day of its evidence</span></div>' +
      groupByDay(rest.map((d) => d.evidence_newest ? d : Object.assign({}, d, { evidence_newest: String(r.created_at || "").slice(0, 10) })).sort((a, b) => String(b.evidence_newest).localeCompare(String(a.evidence_newest)))).map((grp) => (grp.k ? '<div class="dayh">' + esc(dayName(grp.k)) + "</div>" : '<div class="dayh">No date</div>') + '<div class="decs">' + grp.items.map((d) => decCard(d)).join("") + "</div>").join("") + "</section>";
  }
  if (dropped.length) {
    h += '<details class="glass card"><summary><strong>Checked and dropped</strong>' + hq("dropped") + ' <span class="sub">' + dropped.length + " finding" + (dropped.length === 1 ? "" : "s") +
      " that did not pass a check, with the reason</span></summary><div class=\"decs\">" + dropped.map((d) => decCard(d)).join("") + "</div></details>";
  }
  if (r.status === "completed" || r.status === "failed") {
    h += '<div class="cols"><section class="glass card md"><h2 style="margin-bottom:8px">Report</h2>' + md(D.report) + "</section>" +
      '<section class="glass card"><div class="row between" style="margin-bottom:10px"><h2>Changes to memory</h2><span class="mono">main → proposal</span></div>' + diffHtml(D.diff) + "</section></div>";
  }
  const ma = D.memory_activity || { read: [], write: [] };
  if (ma.read.length || ma.write.length) {
    const li = (a) => a.length ? "<ul>" + a.map(([p, n]) => "<li>" + esc(p) + (n > 1 ? " ×" + n : "") + "</li>").join("") + "</ul>" : '<p class="sub">none</p>';
    h += '<details class="glass card"><summary><strong>Memory it read and wrote</strong>' + hq("activity") + ' <span class="sub">' + ma.read.length + " read · " + ma.write.length + " written</span></summary>" +
      '<div class="ops2" style="margin-top:10px"><div><strong>Read</strong>' + li(ma.read) + "</div><div><strong>Wrote</strong>" + li(ma.write) + "</div></div></details>";
  }
  if (s.needs_review && (D.try_targets || []).length) {
    const mac = S.data.health.platform === "Darwin";
    h += '<section class="glass card"><h2 style="margin-bottom:4px">Try it before adopting' + hq("trial") + '</h2><p class="sub" style="margin-bottom:6px">Starts a Claude Code session in the repo that gets this proposal as its context instead of the current one. Nothing is adopted until you click Adopt.</p>' +
      D.try_targets.map((t, i) => '<div class="trow"><strong style="min-width:120px">' + esc(t.name) + "</strong><code>" + esc(t.command) + "</code>" +
        '<button class="btn" type="button" data-copy="' + i + '">Copy</button>' + (mac ? '<button class="btn primary" type="button" data-term="' + i + '">Open in Terminal</button>' : "") + "</div>").join("") + "</section>";
  }
  if (D.run_log) h += '<details class="glass card"><summary><strong>Run log</strong> <span class="sub">every step of this run</span></summary><pre class="file" style="margin-top:10px;max-height:380px;overflow:auto">' + esc(D.run_log) + "</pre></details>";
  if (s.needs_review) {
    const force = changed.length > 0;
    h += '<div class="actions glass">' +
      (force ? '<button class="btn primary" type="button" data-act="force">Merge anyway</button>' : '<button class="btn primary" type="button" data-act="adopt">Adopt</button>') + hq("adopt") +
      '<button class="btn" type="button" data-act="discard">Discard</button>' + hq("discard") +
      '<span class="note">' + (force ? "Memory changed since this run started. Merge anyway keeps both, or discard and run again."
        : "Adopt re-checks nobody changed memory since the run started, then merges and logs it in CHANGELOG.md.") + "</span></div>";
  }
  paint(h, keep);
  $("#cycleSel").onchange = async (e) => { S.cycleId = e.target.value; await loadDetail(); render(false); };
  document.querySelectorAll("[data-dec]").forEach((b) => b.onclick = (e) => busy(e.currentTarget, async () => {
    try { const j = await api("/api/decision", { id: s.id, index: +b.dataset.i, answer: b.dataset.dec }); toast(j.message); await loadDetail(); render(true); } catch (err) { toast(err.message, true); }
  }));
  document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => {
    const cmd = D.try_targets[+b.dataset.copy].command;
    try { await navigator.clipboard.writeText(cmd); toast("Copied. Paste it in a terminal."); } catch (e) { window.prompt("Copy this command:", cmd); }
  });
  document.querySelectorAll("[data-term]").forEach((b) => b.onclick = (e) => busy(e.currentTarget, async () => {
    try { const j = await api("/api/try", { id: s.id, path: D.try_targets[+b.dataset.term].path, open: true }); toast(j.message); } catch (err) { toast(err.message, true); }
  }));
  document.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => act(b.dataset.act, s.id, b));
}
async function act(kind, id, btn) {
  if (kind === "discard" && !confirm("Discard this proposal? Its changes will be deleted.")) return;
  let ok = false;
  await busy(btn, async () => {
    try {
      const j = await api(kind === "discard" ? "/api/discard" : "/api/adopt", { id: id, force: kind === "force" });
      toast(j.message); S.repos = null; S.files = null; ok = true;
    } catch (e) { toast(e.message, true); }
  });
  await refresh(true);
  if (ok) loadRepos();
}

/* ---------- Memory ---------- */
async function openFile(path, quiet) { try { S.file = await api("/api/file?path=" + encodeURIComponent(path)); } catch (e) { if (!quiet) toast(e.message, true); } }
async function viewMemory(keep) {
  if (!S.files) {
    if (!keep) paint('<p class="sub">Loading memory…</p>');
    try { S.files = (await api("/api/memory")).files; } catch (e) { paint('<div class="banner bad">' + esc(e.message) + "</div>"); return; }
  }
  if (!S.file) { const idx = S.files.find((f) => f.path === "memory/index.md") || S.files[0]; if (idx) await openFile(idx.path, true); }
  if (S.tab !== "memory") return;
  const groups = {};
  S.files.forEach((f) => { const parts = f.path.split("/"); const g = parts[0] === "engine" ? "engine" : (parts.length > 2 ? parts[1] : "memory"); (groups[g] = groups[g] || []).push(f); });
  const base = ["memory", "me", "work", "clients", "inbox", "scratch", "engine"];
  const order = base.concat(Object.keys(groups).filter((g) => base.indexOf(g) < 0));
  const list = order.filter((g) => groups[g]).map((g) => '<div class="grp">' + esc(g) + "</div>" + groups[g].map((f) =>
    '<button type="button" data-path="' + esc(f.path) + '" aria-current="' + (S.file && S.file.path === f.path) + '"><span>' + esc(f.path.replace(/^memory\//, "")) + "</span><span>" + f.kb + " KB</span></button>").join("")).join("");
  const F = S.file, pending = S.data.pending.length > 0, scratchy = F && /^memory\/(scratch|inbox)\//.test(F.path);
  let v = "";
  if (F) {
    v = '<div class="row between" style="margin-bottom:12px"><h2 class="mono" style="font-size:15px;color:var(--text)">' + esc(F.path) + '</h2><div class="row">' +
      (S.editing ? hq("edit") + '<button class="btn" type="button" id="cancelEdit">Cancel</button><button class="btn primary" type="button" id="saveEdit">Save</button>'
        : '<button class="btn" type="button" id="showVers" aria-expanded="' + !!S.showVersions + '">' + (S.showVersions ? "Hide versions" : "Versions") + "</button>" +
          (/\.md$/.test(F.path) ? '<button class="btn" type="button" id="startEdit">Edit</button>' : "")) + "</div></div>";
    if (S.editing && pending && !scratchy) v += '<div class="banner warn" style="margin-bottom:12px">A proposal is waiting for review. Saving this file means it will need "Merge anyway".</div>';
    if (S.editing && S.conflict) v += '<div class="banner bad" style="margin-bottom:12px"><strong>This file changed while you were editing</strong> (a cycle or an agent saved a newer version). ' +
      'Your text is still in the editor. <strong>Save</strong> again to replace the newer version with yours, or <strong>Cancel</strong> to drop your edit and see the newer version.' +
      '<details style="margin-top:8px"><summary>Show the newer version</summary><pre class="file" style="margin-top:8px;max-height:260px;overflow:auto">' + esc(S.conflict.content) + "</pre></details></div>";
    v += S.editing ? '<textarea id="editor" spellcheck="false" aria-label="File content"></textarea><p class="sub" style="margin-top:8px">Saving commits the file to your memory repo, so it can always be undone with Git.</p>'
      : '<pre class="file">' + esc(F.content) + "</pre>";
    if (!S.editing && S.showVersions) {
      const V = S.versions && S.versions.path === F.path ? S.versions.versions : null;
      v += '<div style="margin-top:16px"><h2 style="margin-bottom:4px">Versions' + hq("versions") + '</h2><p class="sub" style="margin-bottom:8px">Every saved version of this file. If an old version holds a secret or personal data, Redact scrubs it from history and keeps the record that it existed. The current version cannot be redacted: edit it first.</p>' +
        (!V ? '<p class="sub">Loading…</p>' : !V.length ? '<p class="sub">Not committed yet.</p>' :
          '<div class="scroll vlist"><table style="min-width:520px"><thead><tr><th>When</th><th>Version</th><th>Size</th><th>Change</th><th></th></tr></thead><tbody>' +
          V.map((x) => "<tr><td>" + esc(fmtTime(x.at)) + '</td><td class="mono">' + esc(x.version) + "</td><td>" + (x.deleted ? "deleted" : (x.bytes + " B")) + "</td><td>" + esc(x.message) + "</td><td>" +
            (x.current ? '<span class="badge b-adopted">current</span>' : x.redacted ? '<span class="badge b-muted">redacted</span>' : x.deleted ? "" :
              '<button class="btn" type="button" data-redact="' + esc(x.version) + '">Redact</button>') + "</td></tr>").join("") + "</tbody></table></div>") + "</div>";
    }
  }
  paint('<div class="row between"><h1>Memory</h1><span class="mono">' + esc(S.data.health.home) + "/memory · " + S.data.health.memory_kb + " KB</span></div>" +
    '<div class="row" style="align-items:flex-start;gap:18px"><div class="glass files">' + list + '</div><div class="glass card viewer">' + v + "</div></div>", keep);
  document.querySelectorAll(".files button").forEach((b) => b.onclick = async () => {
    if (S.editing && !confirm("Leave without saving?")) return;
    S.editing = false; S.conflict = null; S.draft = null; S.versions = null; await openFile(b.dataset.path); viewMemory(true);
  });
  if (S.editing) { $("#editor").value = S.draft != null ? S.draft : F.content; $("#editor").focus(); }
  if ($("#startEdit")) $("#startEdit").onclick = (e) => busy(e.currentTarget, async () => {
    await openFile(F.path, true); S.editing = true; S.conflict = null; viewMemory(true);

  const loadVers = async () => { try { S.versions = await api("/api/versions?path=" + encodeURIComponent(F.path)); } catch (e) { S.versions = { path: F.path, versions: [] }; toast(e.message, true); } };
  if ($("#showVers")) $("#showVers").onclick = async () => { S.showVersions = !S.showVersions; viewMemory(true); if (S.showVersions) { await loadVers(); viewMemory(true); } };
  if (S.showVersions && F && (!S.versions || S.versions.path !== F.path)) loadVers().then(() => { if (S.tab === "memory" && !S.editing) viewMemory(true); });
  document.querySelectorAll("[data-redact]").forEach((b) => b.onclick = (e) => {
    if (!confirm("Redact version " + b.dataset.redact + " of " + F.path + "?\n\nThis rewrites the git history of your memory repo so that version's content is gone. The commit stays, with a note that it was redacted.")) return;
    busy(e.currentTarget, async () => {
      try { const j = await api("/api/redact", { path: F.path, version: b.dataset.redact }); toast(j.message); await loadVers(); await openFile(F.path, true); viewMemory(true); } catch (err) { toast(err.message, true); }
    });
  });
  if ($("#cancelEdit")) $("#cancelEdit").onclick = async () => { S.editing = false; S.conflict = null; S.draft = null; await openFile(F.path, true); viewMemory(true); };
  if ($("#saveEdit")) $("#saveEdit").onclick = (e) => busy(e.currentTarget, async () => {
    try {
      const mine = $("#editor").value;
      const j = await api("/api/file", { path: F.path, content: mine, sha: S.conflict ? S.conflict.sha : F.sha });
      toast(j.message); S.editing = false; S.conflict = null; S.draft = null; S.files = null; await openFile(F.path); await loadState(); viewMemory(true);
    } catch (err) {
      if (err.code === "stale") {
        const mine = $("#editor").value;
        let latest = null;
        try { latest = await api("/api/file?path=" + encodeURIComponent(F.path)); } catch (e2) { /* keep going */ }
        if (latest) { S.conflict = { sha: latest.sha, content: latest.content }; S.draft = mine; viewMemory(true); }
        toast("Not saved yet: this file changed while you were editing. Your text is kept. Read the note above the editor.", true);
      } else toast(err.message, true);
    }
  });
}

/* ---------- Repos ---------- */
function repoTags(r) {
  const t = [];
  if (r.status === "confirmed") t.push('<span class="badge b-adopted">' + esc(r.client) + "</span>");
  else if (r.status === "suggested") t.push('<span class="badge b-review">suggested: ' + esc(r.client) + "</span>");
  else if (r.status === "ignored") t.push('<span class="badge b-muted">ignored</span>');
  else t.push('<span class="badge b-review">unmapped</span>');
  const qs = r.checks.filter((c) => c.level === "question" || c.level === "error").length;
  if (qs) t.push('<span class="badge b-failed">' + qs + " to answer</span>");
  if (r.inbox_lines) t.push('<span class="badge b-running">' + r.inbox_lines + " inbox</span>");
  return t.join("");
}
async function loadRepos() {
  try { S.repos = await api("/api/repos"); } catch (e) { return; }
  const n = S.repos.repos.filter((r) => r.status !== "ignored" && r.checks.some((c) => c.level === "question" || c.level === "error")).length;
  const c = $("#cntRepos"); c.hidden = !n; c.textContent = n;
}
async function viewRepos(keep) {

    } catch (err) { toast(err.message, true); }

}

/* ---------- Logs ---------- */
async function loadLogs() {
  const f = S.logF;
  const qs = "?limit=400&level=" + encodeURIComponent(f.level) + (f.event ? "&event=" + encodeURIComponent(f.event) : "") +
    (f.q ? "&q=" + encodeURIComponent(f.q) : "") + (f.cycle ? "&cycle=" + encodeURIComponent(f.cycle) : "");
  try { S.logs = (await api("/api/logs" + qs)).events; } catch (e) { S.logs = S.logs || []; }
}
function logRows() {
  return (S.logs || []).map((e) => {
    const d = e.data ? "<details><summary>details</summary><pre>" + esc(JSON.stringify(e.data, null, 2)) + "</pre></details>" : "";
    return '<tr><td class="t">' + esc(new Date(e.ts).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" })) +
      '</td><td><span class="lvl ' + esc(e.level) + '">' + esc(e.level) + '</span></td><td class="mono">' + esc(e.event) + "</td><td>" + esc(e.msg) + d +
      "</td><td>" + (e.cycle ? '<button class="btn link" type="button" data-d="' + esc(e.cycle) + '">' + esc(e.cycle.slice(-4)) + "</button>" : "") +
      '</td><td class="mono">' + esc(e.actor || "") + "</td></tr>";
  }).join("") || '<tr><td colspan="6" class="sub">No log events match.</td></tr>';
}
function bindLogRows() { document.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => goReview(b.dataset.d)); }
async function viewLogs(keep) {
  if (!S.logs) { if (!keep) paint('<p class="sub">Loading logs…</p>'); await loadLogs(); if (S.tab !== "logs") return; }
  const f = S.logF;
  paint('<div class="row between"><h1>Logs' + hq("logs") + '</h1><span class="sub">' + esc(S.data.health.home) + "/logs/somna.log</span></div>" +
    '<div class="glass filters"><label class="sub" for="lLevel">Level</label><select id="lLevel">' + ["debug", "info", "warn", "error"].map((l) => "<option" + (l === f.level ? " selected" : "") + ">" + l + "</option>").join("") +
    '</select><input id="lEvent" placeholder="event, e.g. engine" value="' + esc(f.event) + '" aria-label="Event prefix"><input id="lQ" placeholder="search text" value="' + esc(f.q) + '" aria-label="Search">' +
    '<input id="lCycle" placeholder="run id" value="' + esc(f.cycle) + '" aria-label="Run id"><button class="btn" type="button" id="lGo">Apply</button>' +
    '<label class="sub" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="lAuto"' + (S.logsAuto ? " checked" : "") + "> live</label></div>" +
    '<div class="glass scroll logs" style="padding:0"><table><thead><tr><th>When</th><th>Level</th><th>Event</th><th>What happened</th><th>Run</th><th>By</th></tr></thead><tbody id="logBody">' + logRows() + "</tbody></table></div>", keep);
  const apply = (btn) => busy(btn, async () => {
    S.logF = { level: $("#lLevel").value, event: $("#lEvent").value.trim(), q: $("#lQ").value.trim(), cycle: $("#lCycle").value.trim() };
    await loadLogs(); const b = $("#logBody"); if (b) { b.innerHTML = logRows(); bindLogRows(); }
  });

async function liveLogs() {
  if (S.tab !== "logs" || !S.logsAuto || typing() || document.querySelector(".logs details[open]")) return;

async function loadSetup() { try { S.setup = await api("/api/setup"); } catch (e) { /* keep last */ } }

    '<section class="glass card"><h2 style="margin-bottom:6px">After that, every day</h2><p class="sub">Work in Claude Code as usual, starting each session inside its repo folder. Each session checks the context against the code and reports corrections to the repo inbox. Every night the cycle curates the day\'s sessions and saves the result by itself when nothing looks wrong. In the morning you get a one-line summary: answer the few questions, or click Undo if you do not like a change. Only unusual cycles wait for your review.</p></section>' +

}
function numRow(key, label, unit, ph) {
  const v = S.settings.settings[key], f = S.settings.fields[key];
  return '<label class="k" for="f_' + key + '">' + esc(label) + hq(key) + '</label><div class="v"><input type="number" id="f_' + key + '" data-key="' + key + '" value="' + (v == null ? "" : esc(v)) + '"' +
    (f.min != null ? ' min="' + f.min + '"' : "") + (f.max != null ? ' max="' + f.max + '"' : "") + (f.type === "money" ? ' step="0.5"' : "") + (ph ? ' placeholder="' + esc(ph) + '"' : "") + "><span class=\"sub\">" + esc(unit || "") + "</span></div>";
}
function boolRow(key, label) {
  return '<label class="k" for="f_' + key + '">' + esc(label) + hq(key) + '</label><div class="v"><label class="switch"><input type="checkbox" id="f_' + key + '" data-key="' + key + '"' + (S.settings.settings[key] ? " checked" : "") + "> on</label></div>";
}
async function viewSettings(keep) {
  if (!S.settings) { if (!keep) paint('<p class="sub">Loading settings…</p>'); await loadSettings(); if (S.tab !== "settings" || !S.settings) return; }
  const X = S.settings, set = X.settings, sc = X.schedule.schedule, n = sc.nightly, w = sc.weekly, M = S.models || {};
  const mac = X.platform === "Darwin";
  let h = '<div class="row between"><div><h1>Settings</h1><p class="sub" style="margin-top:6px">Saved to engine/config.json and committed, so every change can be undone.</p></div></div>';
  h += '<section class="glass card"><h2 style="margin-bottom:10px">Schedule</h2><p class="sub" style="margin-bottom:12px">Next nightly: <strong>' + esc(X.schedule.nightly_next) + "</strong> · next weekly: <strong>" + esc(X.schedule.weekly_next) + "</strong>" +
    (X.schedule.loaded === false ? ' · <span style="color:var(--del-fg)">the scheduler is not loaded, re-run install.sh</span>' : !mac ? " · runs on macOS only" : "") + '</p><div class="set">' +
    '<label class="k" for="nOn">Nightly cycle' + hq("nightly") + '</label><div class="v"><label class="switch"><input type="checkbox" id="nOn"' + (n.enabled ? " checked" : "") + '> on</label><input type="time" id="nTime" value="' + esc(n.time) + '" aria-label="Nightly time">' +
    '<div class="daychips">' + DAYS.map((d, i) => '<label><input type="checkbox" data-nday="' + i + '"' + (n.days.indexOf(i) >= 0 ? " checked" : "") + "> " + d + "</label>").join("") + "</div></div>" +
    '<label class="k" for="wOn">Weekly cycle' + hq("weekly") + '</label><div class="v"><label class="switch"><input type="checkbox" id="wOn"' + (w.enabled ? " checked" : "") + '> on</label>' +
    '<select id="wDay" aria-label="Weekly day">' + DAYS.map((d, i) => '<option value="' + i + '"' + (i === w.day ? " selected" : "") + ">" + d + "</option>").join("") + '</select><input type="time" id="wTime" value="' + esc(w.time) + '" aria-label="Weekly time">' +
    '<span class="sub">reads the last</span><input type="number" id="wDays" min="1" max="30" value="' + esc(w.since_days) + '" aria-label="Weekly window in days" style="width:80px"><span class="sub">days</span></div>' +
    '<label class="k" for="wModel">Weekly model' + hq("weekly_model") + '</label><div class="v">' + modelPick("wModel", w.model) + "</div>" +
    '<label class="k" for="wInstr">Weekly instructions</label><div class="v"><textarea id="wInstr" class="small" maxlength="4096" style="flex:1 1 100%">' + esc(w.instructions) + "</textarea></div></div></section>";
  h += '<section class="glass card"><h2 style="margin-bottom:6px">Models</h2><p class="sub" style="margin-bottom:12px">List from: <strong>' + esc(M.source || "") + "</strong>" + hq("models_source") + " · " + esc(M.note || "") +
    ' <button class="btn link" type="button" id="mRefresh">Refresh list</button></p><div class="set">' +
    '<label class="k" for="f_model">Nightly and manual cycles' + hq("model") + '</label><div class="v">' + modelPick("f_model", set.model) + "</div>" +
    '<label class="k" for="f_map_model">Map' + hq("map_model") + '</label><div class="v">' + modelPick("f_map_model", set.map_model) + "</div></div></section>";
  h += '<section class="glass card"><h2 style="margin-bottom:6px">How changes are checked' + hq("pipeline") + '</h2><p class="sub" style="margin-bottom:12px">The full pipeline reads your work, looks for each kind of change separately, checks every quote and code reference, tries to disprove each finding and has a fresh agent confirm it before anything is saved.</p><div class="set">' +
    '<label class="k" for="f_pipeline">Pipeline</label><div class="v"><select id="f_pipeline" data-key="pipeline"><option value="staged"' + (set.pipeline !== "single" ? " selected" : "") + '>Full: find, check, disprove, confirm</option><option value="single"' + (set.pipeline === "single" ? " selected" : "") + ">One pass: cheaper, no independent checks</option></select></div>" +
    '<label class="k" for="f_hunt_model">Model for finding changes' + hq("hunt_model") + '</label><div class="v">' + modelPick("f_hunt_model", set.hunt_model) + "</div>" +
    '<label class="k" for="f_check_model">Model for the checks' + hq("check_model") + '</label><div class="v">' + modelPick("f_check_model", set.check_model) + "</div>" +
    numRow("small_night_kb", "Light night below", "KB of sessions: one combined search and no disprove step when there are 1 or 2 small sessions") +
    numRow("max_engines", "Claude runs at the same time", "runs") + "</div></section>";
  h += '<section class="glass card"><h2 style="margin-bottom:12px">Limits and cost</h2><div class="set">' +
    numRow("max_budget_usd", "Spend cap per run", "US$ · empty = no cap", "no cap") + numRow("map_max_budget_usd", "Spend cap per map", "US$ · empty = no cap", "no cap") +
    numRow("max_turns", "Turn limit per run", "turns · empty = no limit", "no limit") + numRow("timeout_minutes", "Time limit per run", "minutes") +
    numRow("max_sessions", "Sessions per cycle", "1 to " + X.limits.max_sessions) + numRow("parallel_runs", "Clients at the same time", "runs") +
    numRow("default_since_hours", "First-run window", "hours") + "</div></section>";
  h += '<section class="glass card"><h2 style="margin-bottom:12px">Memory</h2><div class="set">' +
    numRow("max_memory_kb", "Memory size limit", "KB · files over " + X.limits.memory_file_kb + " kB are flagged") + numRow("run_digest_budget_kb", "Reading budget per client run", "KB · about " + fmtTok((set.run_digest_budget_kb || 0) * 256) + " tokens") + numRow("session_max_kb", "Most one session can take", "KB") +
    numRow("context_max_chars", "Repo context size", "characters") + numRow("remap_after_commits", "Re-map suggestion", "commits") + numRow("stale_after_days", "Clean up current state after", "days") + "</div></section>";
  h += '<section class="glass card"><h2 style="margin-bottom:12px">Review</h2><div class="set">' +
    '<label class="k" for="f_review_mode">Review mode' + hq("review_mode") + '</label><div class="v"><select id="f_review_mode" data-key="review_mode">' +
      '<option value="auto"' + (set.review_mode === "auto" ? " selected" : "") + '>Adopt automatically when safe</option><option value="manual"' + (set.review_mode === "manual" ? " selected" : "") + ">Ask me for everything</option></select></div>" +
    numRow("held_expiry_days", "Questions expire after", "days") +
    boolRow("hold_low_confidence", "Hold low-confidence changes") + boolRow("auto_close_empty", "Close empty cycles") + boolRow("notify", "Notifications") + boolRow("stream_events", "Live events") + "</div></section>";
  h += '<div class="savebar glass"><button class="btn primary" type="button" id="setSave">Save settings</button><span class="sub" id="setState">No changes yet.</span></div>';
  paint(h, keep);
  const dirty = () => { S.settingsDirty = true; $("#setState").textContent = "Unsaved changes."; };
  document.querySelectorAll("#main input, #main select, #main textarea").forEach((el) => el.addEventListener("input", dirty));
  document.querySelectorAll("select[data-model]").forEach((sel) => sel.addEventListener("change", () => {
    if (sel.value !== "__custom") return;
    const v = window.prompt("Model id, alias or Bedrock inference profile ARN:", "");
    if (!v) { sel.value = ""; return; }
    const o = document.createElement("option"); o.value = v.trim(); o.textContent = v.trim() + " (custom)"; sel.insertBefore(o, sel.lastElementChild); sel.value = o.value;
  }));
  document.querySelectorAll("[data-check]").forEach((b) => b.onclick = (e) => busy(e.currentTarget, async () => {
    const id = b.dataset.check, m = $("#" + id).value, out = $("#" + id + "Chk");
    out.className = "chk"; out.textContent = "checking… (a one-line test through Claude Code)";
    try { const j = await api("/api/check_model", { model: m === "__custom" ? "" : m }); out.className = "chk ok"; out.textContent = "✓ " + j.message; }
    catch (err) { out.className = "chk bad"; out.textContent = "✗ " + err.message; }
  }));
  $("#mRefresh").onclick = (e) => busy(e.currentTarget, async () => { try { S.models = await api("/api/models?refresh=1"); toast("Model list refreshed from: " + S.models.source); viewSettings(true); } catch (err) { toast(err.message, true); } });
  $("#setSave").onclick = (e) => busy(e.currentTarget, async () => {
    const settings = {};
    document.querySelectorAll("#main [data-key]").forEach((el) => { settings[el.dataset.key] = el.type === "checkbox" ? el.checked : (el.value === "" ? null : (el.type === "number" ? Number(el.value) : el.value)); });
    settings.model = $("#f_model").value === "__custom" ? "" : $("#f_model").value; settings.map_model = $("#f_map_model").value === "__custom" ? "" : $("#f_map_model").value; settings.hunt_model = $("#f_hunt_model").value === "__custom" ? "" : $("#f_hunt_model").value; settings.check_model = $("#f_check_model").value === "__custom" ? "" : $("#f_check_model").value;
    const schedule = { nightly: { enabled: $("#nOn").checked, time: $("#nTime").value, days: Array.from(document.querySelectorAll("[data-nday]")).filter((c) => c.checked).map((c) => +c.dataset.nday) },
      weekly: { enabled: $("#wOn").checked, day: +$("#wDay").value, time: $("#wTime").value, since_days: +$("#wDays").value, model: $("#wModel").value === "__custom" ? "" : $("#wModel").value, instructions: $("#wInstr").value } };
    try { const j = await api("/api/settings", { settings: settings, schedule: schedule }); toast(j.message); S.settingsDirty = false; await loadSettings(); S.setup = null; await loadSetup(); renderHeader(); viewSettings(true); $("#setState").textContent = "Saved."; }
    catch (err) { toast(err.message, true); $("#setState").textContent = err.message; }
  });
}

/* ---------- progress dock: driven by the structured log, updates in place ---------- */
function showDock(on) { $("#dock").classList.toggle("show", !!on && !S.dockHidden); }
function paintDock(p) {
  $("#dock").classList.remove("done");
  $("#dTitle").textContent = p.title || "Working";
  $("#dInfo").textContent = DOCK_INFO[p.type === "map" ? "map" : /^Scan/.test(p.title || "") ? "scan" : "cycle"];
  $("#dStep").textContent = p.step || "";
  const pct = Math.max(2, Math.min(100, p.percent || 0));
  $("#dBar").style.width = pct + "%"; $("#dMeter").setAttribute("aria-valuenow", String(Math.round(pct)));
  $("#dPct").textContent = Math.round(pct) + "%";
  const tk = p.tokens || {}, tot = (tk.input || 0) + (tk.output || 0), mdl = p.model && p.model !== "claude-code-default" ? p.model : "";
  $("#dTime").textContent = fmtDur(p.elapsed) + (tot ? " · " + fmtTok(tot) + " tokens" : "");
  $("#dOps").textContent = (p.memory_reads || p.memory_writes) ? "memory: " + (p.memory_reads || 0) + " read · " + (p.memory_writes || 0) + " written" + (mdl ? " · " + mdl : "") : mdl;
  const c = $("#dCancel"); c.hidden = !p.id; if (!c.classList.contains("is-busy")) { c.disabled = !!p.cancel_requested; c.textContent = p.cancel_requested ? "Canceling…" : "Cancel run"; }
  c.onclick = (e) => { if (!confirm("Cancel this run? Its partial output is deleted and memory stays as it is.")) return;
    busy(e.currentTarget, async () => { try { const j = await api("/api/cancel", { id: p.id }); toast(j.message); } catch (err) { toast(err.message, true); } await tick(); }); };
  $("#dSteps").innerHTML = (p.steps || []).map((s) => '<span class="stp ' + esc(s.state) + '">' + (s.state === "done" ? "✓ " : "") + esc(s.label) + "</span>").join("");
  const live = (p.live || []).filter((e) => e.kind === "tool" || e.kind === "text" || e.kind === "tool_error").slice(-4);
  $("#dFeed").innerHTML = live.length ? live.map((e) => e.kind === "text" ? '<div class="say">“' + esc(e.text) + "”</div>"
      : e.kind === "tool_error" ? '<div><span class="tg w">error</span>' + esc(e.text) + "</div>"
      : '<div><span class="tg' + (e.memory === "write" ? " w" : e.memory === "read" ? " r" : "") + '">' + esc(e.memory ? (e.memory === "write" ? "write" : "read") : e.tool) + "</span>" + esc(e.target) + "</div>").join("")
    : (p.recent || []).slice(-3).map((e) => "<div>" + esc(e.event + "  " + e.msg) + "</div>").join("");
  $("#dOpen").hidden = true;
}
function paintDone(last) {
  $("#dock").classList.add("done");
  const failed = last && last.status === "failed", canceled = last && last.status === "canceled";
  $("#dCancel").hidden = true; $("#dOps").textContent = ""; $("#dInfo").textContent = "";
  $("#dTitle").textContent = !last ? "Done" : canceled ? "Canceled" : failed ? "Run failed" : last.needs_review ? "Ready for review" : "Finished";
  $("#dStep").textContent = last ? (last.error || last.diffstat || last.note || "") : "";
  if (canceled) $("#dStep").textContent = "Nothing was changed.";
  $("#dBar").style.width = "100%"; $("#dPct").textContent = failed || canceled ? "stopped" : "100%";
  $("#dFeed").innerHTML = ""; $("#dSteps").innerHTML = "";
  $("#dOpen").hidden = !last; $("#dOpen").textContent = last && last.needs_review ? "Review it" : "Open";
  $("#dOpen").onclick = () => { showDock(false); goReview(last.id); };
}
let tickTimer = null;
async function tick() {
  clearTimeout(tickTimer);
  let p;
  try { p = await api("/api/progress"); } catch (e) { tickTimer = setTimeout(tick, 5000); return; }
  S.prog = p;
  if (p.running) {
    if (!S.wasRunning) { S.wasRunning = true; if (S.data) renderHeader(); }
    paintDock(p); showDock(true);
    tickTimer = setTimeout(tick, 1500);
    return;
  }
  if (S.wasRunning) {
    S.wasRunning = false; paintDone(p.last); showDock(true);
    const failed = p.last && p.last.status === "failed";
    const canceled = p.last && p.last.status === "canceled";
    toast(failed ? "The run failed. Open it to see why." : canceled ? "Canceled." : "Finished.", failed);
    S.autoPicked = false; S.files = null;
    if (S.file && !S.editing) await openFile(S.file.path, true);
    await loadRepos();
    await refresh(true);
    setTimeout(() => { if (!S.wasRunning) showDock(false); }, 12000);
  }
  tickTimer = setTimeout(tick, 10000);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest ? e.target.closest("[data-help]") : null, pop = $("#pop");
  if (!b) { if (!pop.hidden && !pop.contains(e.target)) pop.hidden = true; return; }
  e.preventDefault(); e.stopPropagation();
  if (!pop.hidden && pop.dataset.key === b.dataset.help) { pop.hidden = true; return; }
  const h = HELP[b.dataset.help] || [b.dataset.help, ""];
  pop.innerHTML = "<strong>" + esc(h[0]) + "</strong>" + esc(h[1]); pop.dataset.key = b.dataset.help; pop.hidden = false;
  const r = b.getBoundingClientRect(), w = pop.offsetWidth;
  pop.style.left = Math.max(16, Math.min(window.scrollX + r.left - 20, window.scrollX + document.documentElement.clientWidth - w - 16)) + "px";
  pop.style.top = (window.scrollY + r.bottom + 8) + "px";
}, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#pop").hidden = true; });
$("#helpBtn").onclick = () => { S.tab = "start"; renderHeader(); render(false); window.scrollTo(0, 0); };
$("#pendingPill").onclick = () => {
  if (S.data && S.data.pending.length) return goReview(S.data.pending[0]);
  S.tab = "questions"; renderHeader(); render(false); window.scrollTo(0, 0);
};
$("#dHide").onclick = () => { S.dockHidden = true; showDock(false); };
$("#dLogs").onclick = () => { S.tab = "logs"; S.logs = null; renderHeader(); render(false); window.scrollTo(0, 0); };

/* ---------- wiring ---------- */
const SH = { list: null, picked: new Set() };
function shSrc() { return (document.querySelector('input[name="shSrc"]:checked') || {}).value; }
function shCount() { const n = $("#shInstr").value.length; $("#shCount").textContent = n.toLocaleString() + " / 4,096"; }
function shPicked() {
  const n = SH.picked.size;
  const kb = (SH.list || []).filter((x) => SH.picked.has(x.id)).reduce((a, x) => a + (x.size_kb || 0), 0);
  $("#shSel").textContent = n + " selected · 1 to 100" + (n ? " · " + Math.round(kb) + " KB to read" + (SH.budget ? " (budget " + SH.budget + " KB per client)" : "") : "");
  document.querySelectorAll("#shList input").forEach((c) => { c.disabled = !c.checked && n >= 100; });
}
async function shLoad() {
  $("#shList").innerHTML = '<p class="sub" style="padding:8px">Loading…</p>';
  try { const r = await api("/api/sessions?days=" + $("#shDays").value); SH.list = r.sessions; SH.cap = r.session_max_kb; SH.budget = r.budget_kb; } catch (e) { $("#shList").innerHTML = '<p class="sub" style="padding:8px">' + esc(e.message) + "</p>"; return; }
  $("#shList").innerHTML = SH.list.length ? SH.list.map((x) => '<label class="srow"><input type="checkbox" value="' + esc(x.id) + '"' + (SH.picked.has(x.id) ? " checked" : "") + '><span style="min-width:0"><span class="tl">' +
    esc(x.title || "(no text)") + '</span><br><span class="m">' + esc((x.started ? fmtTime(x.started) + " → " : "") + fmtTime(x.modified) + " · " + x.repo + (x.client ? " · " + x.client : "") + (x.subagents ? " · " + x.subagents + " subagent" + (x.subagents === 1 ? "" : "s") : "") +
      (x.size_kb != null ? " · " + (x.size_kb < 0.1 ? "<0.1" : x.size_kb) + " KB · ~" + fmtTok(x.est_tokens) + " tokens" : "") + " · " + x.id) + (x.size_kb != null && SH.cap && x.size_kb > SH.cap ? ' <span class="badge b-review">larger than one session may take</span>' : "") + "</span></span></label>").join("")
    : '<p class="sub" style="padding:8px">No sessions in this period.</p>';
  document.querySelectorAll("#shList input").forEach((c) => c.onchange = () => { if (c.checked) SH.picked.add(c.value); else SH.picked.delete(c.value); shPicked(); });
  shPicked();
}
function openSheet() {
  if (!S.data) return;
  const H = S.data.health, sel = $("#shModel"), cur = sel.value;
  sel.innerHTML = '<option value="">' + esc(H.default_model ? "Default (" + H.default_model + ")" : "Claude Code default") + "</option>" +
    (H.models || []).map((m) => '<option value="' + esc(m) + '">' + esc(m) + "</option>").join("");
  sel.value = cur || "";
  $("#sheetWrap").hidden = false; shCount(); $("#shInstr").focus();
}
function shReset() {
  $("#shInstr").value = ""; $("#shModel").value = ""; SH.picked.clear(); SH.list = null;
  document.querySelector('input[name="shSrc"][value="since"]').checked = true; $("#shPick").hidden = true;
}
function closeSheet() { $("#sheetWrap").hidden = true; $("#runBtn").focus(); }
$("#runBtn").onclick = () => openSheet();
$("#shClose").onclick = closeSheet; $("#shCancel").onclick = closeSheet;
$("#sheetWrap").onclick = (e) => { if (e.target.id === "sheetWrap") closeSheet(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheetWrap").hidden) closeSheet(); });
$("#shInstr").oninput = shCount;
document.querySelectorAll('input[name="shSrc"]').forEach((r) => r.onchange = () => { $("#shPick").hidden = shSrc() !== "pick"; if (shSrc() === "pick" && !SH.list) shLoad(); });
$("#shDays").onchange = shLoad;
$("#shStart").onclick = (e) => {
  const body = { instructions: $("#shInstr").value.trim(), model: $("#shModel").value };
  if (shSrc() === "pick") { if (!SH.picked.size) { toast("Choose at least one session", true); return; } body.session_ids = Array.from(SH.picked); }
  busy(e.currentTarget, async () => {
    try { const j = await api("/api/run", body); toast(j.message); closeSheet(); shReset(); S.dockHidden = false; await tick(); }
    catch (err) { toast(err.message, true); }
  });
};
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  if (S.tab === "memory" && S.editing && !confirm("Leave without saving?")) return;
  if (S.tab === "settings" && S.settingsDirty && b.dataset.tab !== "settings" && !confirm("Leave Settings without saving?")) return;
  if (b.dataset.tab === "settings") { S.settings = null; S.settingsDirty = false; }
  if (b.dataset.tab === "start") S.setup = null;
  S.editing = false; S.conflict = null; S.draft = null; S.tab = b.dataset.tab; if (S.tab === "logs") S.logs = null;
  renderHeader(); render(false); window.scrollTo(0, 0);
  if (S.tab === "repos") loadRepos().then(() => { if (S.tab === "repos" && !typing()) viewRepos(true); });
  if (S.tab === "memory") api("/api/memory").then(async (j) => { S.files = j.files; if (S.file && !S.editing) await openFile(S.file.path, true); if (S.tab === "memory" && !S.editing) viewMemory(true); }).catch(() => {});
});
/* quiet background refresh: only re-render when something actually changed, never while a job runs or you type */
async function quiet() {
  try {
    if (!(S.tab === "memory" && S.editing) && !typing() && !S.wasRunning) {
      const before = S.sig, picked = await loadState(), sig = signature(S.data);
      renderHeader();
      if ((sig !== before || picked) && S.tab !== "settings") { S.sig = sig; await loadDetail(); if (S.tab === "repos") await loadRepos(); if (S.tab === "start") await loadSetup(); render(true); }
    }
    if (S.tab === "memory" && !S.editing && S.file && !typing()) {
      const was = S.file.sha; await openFile(S.file.path, true);
      if (S.file && S.file.sha !== was) { viewMemory(true); toast("This file was just updated (a cycle or an agent saved it). Showing the new version."); }
    }
    await liveLogs();
  } catch (e) { /* server restarting, try again next time */ }
  setTimeout(quiet, S.tab === "logs" ? 5000 : 30000);
}
Promise.all([loadSetup(), loadState().catch(() => null)]).then(() => {
  if (S.setup && S.setup.done < S.setup.total && !(S.data && S.data.pending.length)) S.tab = "start";
  return refresh(false);
}).then(() => { tick(); loadRepos(); setTimeout(quiet, 30000); });
</script>
